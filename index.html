<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>GATE TEST SERIES</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f3f6;
    color:#17202a;
}

header{
    background:#123f68;
    color:white;
    text-align:center;
    padding:13px;
    font-size:20px;
    font-weight:bold;
}

.wrap{
    max-width:1200px;
    margin:auto;
    padding:12px;
}

.card{
    background:white;
    border-radius:12px;
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 2px 10px #0002;
}

label{
    display:block;
    font-weight:bold;
    margin:14px 0 7px;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #bbb;
    border-radius:8px;
    background:white;
    font-size:16px;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 15px;
    cursor:pointer;
    font-weight:bold;
    color:white;
}

button:disabled{
    opacity:.6;
}

.start{
    width:100%;
    background:#123f68;
    margin-top:18px;
    font-size:18px;
}

.hidden{
    display:none!important;
}

.status{
    font-size:14px;
    margin-top:7px;
    color:#555;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.timer{
    background:#111;
    color:white;
    padding:9px 13px;
    border-radius:6px;
    font-weight:bold;
    white-space:nowrap;
}

.examgrid{
    display:grid;
    grid-template-columns:1fr 280px;
    gap:14px;
}

.questionbox{
    min-height:300px;
}

.questionhead{
    display:flex;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid #ddd;
    padding-bottom:10px;
    margin-bottom:10px;
}

.badge{
    font-weight:bold;
    color:#123f68;
}

.questiontext{
    white-space:pre-wrap;
    line-height:1.5;
    font-size:16px;
}

.option{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:11px;
    border:1px solid #ccc;
    border-radius:8px;
    margin:9px 0;
    cursor:pointer;
}

.option:hover{
    background:#f5f8fb;
}

.option input{
    width:auto;
    margin-top:3px;
}

.natinput{
    width:100%;
    padding:12px;
    border:1px solid #aaa;
    border-radius:8px;
    font-size:17px;
    margin-top:12px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:15px;
}

.prev{background:#6c757d}
.clear{background:#dc3545}
.review{background:#f0ad00}
.next{background:#123f68}
.submit{background:#198754}

.palette{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
    margin-top:10px;
}

.pbtn{
    color:#222;
    background:#e9ecef;
    padding:9px 3px;
}

.pbtn.answered{
    background:#63b43b;
    color:white;
}

.pbtn.reviewed{
    background:#f5bd18;
    color:#111;
}

.pbtn.current{
    outline:3px solid #145da0;
}

.legend{
    font-size:12px;
    line-height:1.8;
    margin-top:12px;
}

.green{color:#63b43b}
.yellow{color:#e0aa00}
.grey{color:#777}

.loading{
    text-align:center;
    padding:25px;
    font-weight:bold;
}

.result{
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.resultitem{
    background:#f7f7f7;
    border-left:5px solid #123f68;
    padding:12px;
    margin:10px 0;
    border-radius:5px;
}

.correct{
    color:#16803c;
    font-weight:bold;
}

.wrong{
    color:#c62828;
    font-weight:bold;
}

.solution{
    background:#fff8df;
    border:1px solid #e7cf72;
    padding:12px;
    margin-top:8px;
    border-radius:7px;
    white-space:pre-wrap;
}

@media(max-width:800px){
    .examgrid{
        grid-template-columns:1fr;
    }

    .palette{
        grid-template-columns:repeat(5,1fr);
    }
}
</style>
</head>

<body>

<header>GATE TEST SERIES</header>

<div class="wrap">

<!-- SETUP -->
<section id="setup" class="card">

<h2>Test Setup</h2>

<label>Question PDF</label>
<input id="questionPDF" type="file" accept=".pdf,application/pdf">
<div id="pdfStatus" class="status">Question PDF select karo.</div>

<label>Test Time (Minutes)</label>
<input id="timeInput" type="number" min="1" value="180">

<label>Negative Marking</label>
<select id="negativeMarking">
<option value="on">ON</option>
<option value="off">OFF</option>
</select>

<label>1 Mark Question Negative</label>
<select id="neg1">
<option value="0.3333333333">1/3</option>
<option value="0">0</option>
</select>

<label>2 Mark Question Negative</label>
<select id="neg2">
<option value="0.6666666667">2/3</option>
<option value="0">0</option>
</select>

<label>Answer Key (optional - test ke baad bhi upload kar sakte ho)</label>
<input id="answerKey" type="file"
accept=".txt,.csv,.json,.pdf,application/pdf">
<div id="keyStatus" class="status">
Answer key optional hai.
</div>

<button id="startBtn" class="start" type="button">
START TEST
</button>

</section>


<!-- EXAM -->
<section id="test" class="hidden">

<div class="topbar">
    <div>
        <b>GATE TEST</b>
        <div id="progress">Question 0 of 0</div>
    </div>

    <div id="timer" class="timer">00:00:00</div>
</div>

<div id="loading" class="card loading">
    PDF read ho raha hai...
</div>

<div id="examArea" class="examgrid hidden">

<div>

<div class="card questionbox">

<div class="questionhead">
    <div id="questionTitle" class="badge">
        Question
    </div>

    <div id="attemptStatus" class="status">
        Not attempted
    </div>
</div>

<div id="questionText" class="questiontext"></div>

<div id="options"></div>

<div id="buttons" class="buttons">

<button id="prevBtn" class="prev" type="button">
PREVIOUS
</button>

<button id="clearBtn" class="clear" type="button">
CLEAR RESPONSE
</button>

<button id="reviewBtn" class="review" type="button">
MARK FOR REVIEW
</button>

<button id="nextBtn" class="next" type="button">
SAVE & NEXT
</button>

<button id="submitBtn" class="submit" type="button">
SUBMIT TEST
</button>

</div>

</div>

</div>


<!-- PALETTE -->
<div class="card">

<h3>Question Palette</h3>

<div id="palette" class="palette"></div>

<div class="legend">
<span class="green">■</span> Answered<br>
<span class="yellow">■</span> Marked for Review<br>
<span class="grey">■</span> Not Answered
</div>

</div>

</div>

</section>


<!-- RESULT -->
<section id="resultSection" class="hidden">

<div class="card">

<h2>Test Result</h2>

<div id="score" class="result"></div>

<div id="resultDetails"></div>

<div id="answerKeyAfter"></div>

</div>

</section>

</div>


<script>

"use strict";

/* PDF.JS */
if(window.pdfjsLib){
    pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}


/* VARIABLES */

let sourceFile = null;
let keyFile = null;

let questions = [];
let answers = [];
let reviewed = [];

let current = 0;

let seconds = 0;
let timerId = null;

let submitted = false;

let answerKey = {};


/* ELEMENT HELPER */

function $(id){
    return document.getElementById(id);
}


/* PDF SELECT */

$("questionPDF").addEventListener("change", function(e){

    sourceFile =
        e.target.files && e.target.files.length
        ? e.target.files[0]
        : null;

    if(sourceFile){

        $("pdfStatus").textContent =
            "Selected: " + sourceFile.name;

    }else{

        $("pdfStatus").textContent =
            "Question PDF select karo.";

    }

});


/* ANSWER KEY SELECT */

$("answerKey").addEventListener("change", function(e){

    keyFile =
        e.target.files && e.target.files.length
        ? e.target.files[0]
        : null;

    if(keyFile){

        $("keyStatus").textContent =
            "Selected: " + keyFile.name;

    }else{

        $("keyStatus").textContent =
            "Answer key optional hai.";

    }

});


/* START */

$("startBtn").addEventListener("click", startTest);


async function startTest(){

    try{

        if(!sourceFile){

            alert("Question PDF select karo.");
            return;

        }

        let mins =
            parseInt($("timeInput").value,10);

        if(!Number.isFinite(mins) || mins <= 0){

            alert("Valid test time enter karo.");
            return;

        }

        if(!window.pdfjsLib){

            alert("PDF reader load nahi hua. Internet ON karke page refresh karo.");
            return;

        }

        $("startBtn").disabled = true;
        $("startBtn").textContent = "PDF READING...";

        $("setup").classList.add("hidden");
        $("test").classList.remove("hidden");

        $("loading").classList.remove("hidden");
        $("examArea").classList.add("hidden");

        questions = await readPDF(sourceFile);

        if(!questions.length){

            throw new Error(
                "PDF se questions detect nahi ho paaye."
            );

        }

        answers =
            new Array(questions.length).fill(null);

        reviewed =
            new Array(questions.length).fill(false);

        current = 0;

        seconds = mins * 60;

        submitted = false;

        buildPalette();

        renderQuestion();

        $("loading").classList.add("hidden");
        $("examArea").classList.remove("hidden");

        startTimer();

    }catch(err){

        console.error(err);

        $("test").classList.add("hidden");
        $("setup").classList.remove("hidden");

        $("startBtn").disabled = false;
        $("startBtn").textContent = "START TEST";

        alert(
            "PDF read karne me problem hui.\n\n" +
            (err && err.message ? err.message : "Unknown error")
        );

    }

}


/* READ PDF */

async function readPDF(file){

    const buffer =
        await file.arrayBuffer();

    const pdf =
        await pdfjsLib.getDocument({
            data:buffer
        }).promise;

    let allPages = [];

    for(let p=1; p<=pdf.numPages; p++){

        const page =
            await pdf.getPage(p);

        const content =
            await page.getTextContent();

        let text =
            content.items
            .map(x => x.str || "")
            .join(" ");

        text =
            cleanText(text);

        if(text.trim()){

            allPages.push({
                page:p,
                text:text
            });

        }

    }

    return extractQuestions(allPages);

}


/* CLEAN TEXT */

function cleanText(text){

    return String(text || "")
        .replace(/\u00a0/g," ")
        .replace(/[ \t]+/g," ")
        .replace(/\s+\n\s+/g,"\n")
        .trim();

}


/* QUESTION EXTRACTION */

function extractQuestions(pages){

    let full = "";

    for(const pg of pages){

        full +=
            "\n\n[PAGE " +
            pg.page +
            "]\n" +
            pg.text;

    }


    /*
      Different PDF formats me Q1, Q.1, Question 1,
      1. etc mil sakta hai.
    */

    let matches = [];

    const re =
        /(?:^|\n|\s)(?:Q(?:uestion)?\.?\s*)(\d{1,3})(?:\s|[.:)-])/gi;

    let m;

    while((m = re.exec(full)) !== null){

        matches.push({
            number:parseInt(m[1],10),
            start:m.index,
            end:re.lastIndex
        });

    }


    /* Duplicate question numbers ko avoid karo */

    let unique = [];
    let seen = new Set();

    for(const item of matches){

        if(!seen.has(item.number)){

            seen.add(item.number);
            unique.push(item);

        }

    }


    /*
      Agar Q1/Q2 format nahi mila to fallback:
      page-wise numbered questions.
    */

    if(unique.length < 1){

        return fallbackQuestions(pages);

    }


    let result = [];

    for(let i=0; i<unique.length; i++){

        const start =
            unique[i].end;

        const end =
            i+1 < unique.length
            ? unique[i+1].start
            : full.length;

        let block =
            full.slice(start,end).trim();

        if(block.length < 10)
            continue;


        let q =
            parseQuestionBlock(
                unique[i].number,
                block
            );

        if(q){

            q.number =
                unique[i].number;

            result.push(q);

        }

    }


    return result;

}


/* FALLBACK */

function fallbackQuestions(pages){

    let result = [];

    let n = 1;

    for(const pg of pages){

        let blocks =
            pg.text.split(
                /\n(?=\d{1,3}[.)]\s)/
            );

        for(const b of blocks){

            let t =
                b.trim();

            if(t.length < 20)
                continue;

            let q =
                parseQuestionBlock(n,t);

            if(q){

                q.number=n;
                result.push(q);
                n++;

            }

        }

    }

    return result;

}


/* PARSE QUESTION */

function parseQuestionBlock(number, block){

    let text =
        cleanText(block);


    /*
      Remove page markers
    */

    text =
        text.replace(
            /\[PAGE\s+\d+\]/gi,
            ""
        );


    /*
      Detect options
    */

    let optionRegex =
        /(?:^|\s)(?:\(?([A-D])\)?)[\s.:)-]+/gi;

    let positions = [];

    let m;

    while((m = optionRegex.exec(text)) !== null){

        positions.push({
            letter:m[1].toUpperCase(),
            start:m.index,
            end:optionRegex.lastIndex
        });

    }


    /*
      Need at least two options for MCQ.
    */

    let options = [];

    if(positions.length >= 2){

        for(let i=0;i<positions.length;i++){

            let s =
                positions[i].end;

            let e =
                i+1 < positions.length
                ? positions[i+1].start
                : text.length;

            let opt =
                text.slice(s,e).trim();

            /*
              Solution text ko option me jaane se roko
            */

            opt =
                removeSolution(opt);

            if(opt){

                options.push({
                    label:positions[i].letter,
                    text:opt
                });

            }

        }

    }


    /*
      Question text:
      first option se pehle ka part
    */

    let questionText;

    if(positions.length){

        questionText =
            text.slice(
                0,
                positions[0].start
            ).trim();

    }else{

        questionText = text;

    }


    questionText =
        removeSolution(questionText);


    /*
      Detect NAT
    */

    let upper =
        questionText.toUpperCase();

    let type =
        "MCQ";

    if(
        upper.includes("NAT") ||
        upper.includes("NUMERICAL") ||
        options.length < 2
    ){

        type = "NAT";

    }


    /*
      Detect marks
    */

    let marks = 1;

    if(
        upper.includes("2 MARK") ||
        upper.includes("2-MARK") ||
        upper.includes("2 MARKS")
    ){

        marks = 2;

    }


    /*
      Clean metadata
    */

    questionText =
        questionText
        .replace(
            /^.*?INTERMEDIATE\s*[:\-]/i,
            ""
        )
        .trim();


    if(!questionText){

        return null;

    }


    return {
        number:number,
        text:questionText,
        options:options,
        type:type,
        marks:marks,
        solution:""
    };

}


/* REMOVE SOLUTION */

function removeSolution(text){

    let patterns = [
        /\bSOLUTION\b[\s\S]*$/i,
        /\bSOL\.\b[\s\S]*$/i,
        /\bANSWER\s*[:\-][\s\S]*$/i,
        /\bEXPLANATION\b[\s\S]*$/i
    ];

    let out = text;

    for(const p of patterns){

        out =
            out.replace(p,"");

    }

    return out.trim();

}


/* TIMER */

function startTimer(){

    stopTimer();

    updateTimer();

    timerId =
        setInterval(function(){

            if(seconds <= 0){

                stopTimer();

                alert(
                    "Time Over! Test automatically submit ho raha hai."
                );

                finishTest();

                return;

            }

            seconds--;

            updateTimer();

        },1000);

}


function stopTimer(){

    if(timerId !== null){

        clearInterval(timerId);
        timerId = null;

    }

}


function updateTimer(){

    let h =
        Math.floor(seconds/3600);

    let m =
        Math.floor((seconds%3600)/60);

    let s =
        seconds%60;

    $("timer").textContent =
        String(h).padStart(2,"0") +
        ":" +
        String(m).padStart(2,"0") +
        ":" +
        String(s).padStart(2,"0");

}


/* RENDER QUESTION */

function renderQuestion(){

    if(!questions.length)
        return;

    const q =
        questions[current];

    $("progress").textContent =
        "Question " +
        (current+1) +
        " of " +
        questions.length;

    $("questionTitle").textContent =
        "Question " +
        q.number +
        " • " +
        q.type +
        " • " +
        q.marks +
        " Mark" +
        (q.marks === 2 ? "s" : "");

    $("questionText").textContent =
        q.text;


    const box =
        $("options");

    box.innerHTML = "";


    if(q.type === "NAT"){

        const input =
            document.createElement("input");

        input.className =
            "natinput";

        input.type =
            "text";

        input.placeholder =
            "Enter numerical answer";

        input.value =
            answers[current] === null
            ? ""
            : answers[current];

        input.addEventListener(
            "input",
            function(){

                answers[current] =
                    input.value.trim() === ""
                    ? null
                    : input.value.trim();

                updateStatus();
                buildPalette();

            }
        );

        box.appendChild(input);

    }else{

        if(!q.options.length){

            const msg =
                document.createElement("div");

            msg.className="status";

            msg.textContent =
                "Options PDF se detect nahi hue.";

            box.appendChild(msg);

        }


        q.options.forEach(function(opt){

            const label =
                document.createElement("label");

            label.className =
                "option";


            const radio =
                document.createElement("input");

            radio.type =
                "radio";

            radio.name =
                "question_" + current;

            radio.value =
                opt.label;


            if(answers[current] === opt.label){

                radio.checked = true;

            }


            radio.addEventListener(
                "change",
                function(){

                    answers[current] =
                        radio.value;

                    updateStatus();
                    buildPalette();

                }
            );


            const span =
                document.createElement("span");

            span.textContent =
                opt.label +
                ". " +
                opt.text;


            label.appendChild(radio);
            label.appendChild(span);

            box.appendChild(label);

        });

    }


    updateStatus();
    buildPalette();

}


/* STATUS */

function updateStatus(){

    if(answers[current] !== null){

        $("attemptStatus").textContent =
            reviewed[current]
            ? "Answered + Review"
            : "Answered";

    }else{

        $("attemptStatus").textContent =
            reviewed[current]
            ? "Marked for Review"
            : "Not attempted";

    }

}


/* PALETTE */

function buildPalette(){

    const p =
        $("palette");

    p.innerHTML = "";


    questions.forEach(function(q,i){

        const b =
            document.createElement("button");

        b.type =
            "button";

        b.className =
            "pbtn";

        b.textContent =
            i+1;


        if(answers[i] !== null){

            b.classList.add("answered");

        }

        if(reviewed[i]){

            b.classList.add("reviewed");

        }

        if(i === current){

            b.classList.add("current");

        }


        b.addEventListener(
            "click",
            function(){

                current=i;
                renderQuestion();

                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });

            }
        );


        p.appendChild(b);

    });

}


/* PREVIOUS */

$("prevBtn").addEventListener(
    "click",
    function(){

        if(current > 0){

            current--;
            renderQuestion();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }

    }
);


/* CLEAR */

$("clearBtn").addEventListener(
    "click",
    function(){

        answers[current] = null;

        renderQuestion();

    }
);


/* REVIEW */

$("reviewBtn").addEventListener(
    "click",
    function(){

        reviewed[current] =
            !reviewed[current];

        updateStatus();
        buildPalette();

    }
);


/* NEXT */

$("nextBtn").addEventListener(
    "click",
    function(){

        if(current < questions.length-1){

            current++;

            renderQuestion();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }else{

            alert(
                "Ye last question hai. Submit Test dabao."
            );

        }

    }
);


/* SUBMIT */

$("submitBtn").addEventListener(
    "click",
    function(){

        if(
            confirm(
                "Kya aap test submit karna chahte hain?"
            )
        ){

            finishTest();

        }

    }
);


/* FINISH */

async function finishTest(){

    if(submitted)
        return;

    submitted=true;

    stopTimer();

    $("examArea").classList.add("hidden");

    $("loading").classList.remove("hidden");

    $("loading").textContent =
        "Result calculate ho raha hai...";


    try{

        if(keyFile){

            answerKey =
                await readAnswerKey(keyFile);

        }else{

            answerKey = {};

        }

    }catch(e){

        console.error(e);

        answerKey={};

    }


    calculateResult();

}


/* READ ANSWER KEY */

async function readAnswerKey(file){

    let name =
        file.name.toLowerCase();


    if(
        name.endsWith(".txt") ||
        name.endsWith(".csv") ||
        name.endsWith(".json")
    ){

        let text =
            await file.text();

        return parseAnswerText(text);

    }


    /*
      PDF answer key
    */

    if(name.endsWith(".pdf")){

        let pages =
            await extractPDFText(file);

        let text =
            pages.map(x=>x.text).join("\n");

        return parseAnswerText(text);

    }


    return {};

}


/* PDF TEXT ONLY */

async function extractPDFText(file){

    const buffer =
        await file.arrayBuffer();

    const pdf =
        await pdfjsLib.getDocument({
            data:buffer
        }).promise;

    let pages=[];

    for(let p=1;p<=pdf.numPages;p++){

        const page =
            await pdf.getPage(p);

        const content =
            await page.getTextContent();

        const text =
            content.items
            .map(x=>x.str || "")
            .join(" ");

        pages.push({
            page:p,
            text:cleanText(text)
        });

    }

    return pages;

}


/* PARSE ANSWER KEY */

function parseAnswerText(text){

    let key={};


    /*
      Accepted formats:

      1 A
      1:A
      1-A
      Q1 A
      Q1:A
      1 2.50
    */

    const lines =
        String(text || "")
        .split(/\r?\n/);


    for(let line of lines){

        line=line.trim();

        if(!line)
            continue;


        let m =
            line.match(
                /^(?:Q(?:uestion)?\s*)?(\d{1,3})\s*[:.,\-]?\s*([A-D]|-?\d+(?:\.\d+)?)/i
            );


        if(m){

            let n =
                parseInt(m[1],10);

            let value =
                m[2].toUpperCase();

            key[n]=value;

        }

    }


    /*
      Also try continuous text.
    */

    if(Object.keys(key).length === 0){

        let re =
            /(?:Q(?:uestion)?\s*)?(\d{1,3})\s*[:.)\-]\s*([A-D]|-?\d+(?:\.\d+)?)/gi;

        let m;

        while((m=re.exec(text))!==null){

            key[
                parseInt(m[1],10)
            ] =
                m[2].toUpperCase();

        }

    }


    return key;

}


/* CALCULATE */

function calculateResult(){

    let total=0;
    let attempted=0;
    let correct=0;
    let wrong=0;

    let details=[];


    for(let i=0;i<questions.length;i++){

        const q =
            questions[i];

        const user =
            answers[i];

        const correctAnswer =
            answerKey[q.number];


        let state =
            "Not Attempted";

        let marks=0;


        if(user !== null){

            attempted++;


            if(
                correctAnswer !== undefined &&
                isCorrect(user,correctAnswer,q.type)
            ){

                correct++;
                marks=q.marks;
                state="Correct";

            }else if(
                correctAnswer !== undefined
            ){

                wrong++;

                if(
                    $("negativeMarking").value === "on" &&
                    q.type === "MCQ"
                ){

                    let neg =
                        q.marks === 2
                        ? parseFloat($("neg2").value)
                        : parseFloat($("neg1").value);

                    marks=-neg;

                }

                state="Wrong";

            }else{

                state="Attempted - Answer Key Missing";

            }

        }


        total += marks;


        details.push({
            q:q,
            user:user,
            correct:correctAnswer,
            state:state,
            marks:marks
        });

    }


    showResult(
        total,
        attempted,
        correct,
        wrong,
        details
    );

}


/* CHECK ANSWER */

function isCorrect(user,key,type){

    if(type === "NAT"){

        let a =
            parseFloat(user);

        let b =
            parseFloat(key);

        if(
            Number.isFinite(a) &&
            Number.isFinite(b)
        ){

            return Math.abs(a-b) < 0.000001;

        }

        return String(user).trim() ===
               String(key).trim();

    }


    return String(user).trim().toUpperCase() ===
           String(key).trim().toUpperCase();

}


/* SHOW RESULT */

function showResult(
    total,
    attempted,
    correct,
    wrong,
    details
){

    $("loading").classList.add("hidden");

    $("resultSection")
        .classList.remove("hidden");


    $("score").innerHTML =
        "Score: " +
        total.toFixed(2) +
        "<br><small>" +
        "Attempted: " + attempted +
        " | Correct: " + correct +
        " | Wrong: " + wrong +
        "</small>";


    const box =
        $("resultDetails");

    box.innerHTML =
        "<h3>Question-wise Result</h3>";


    details.forEach(function(d){

        const div =
            document.createElement("div");

        div.className =
            "resultitem";


        let html =
            "<b>Question " +
            d.q.number +
            "</b><br>";


        html +=
            "Your Answer: " +
            (d.user === null ? "Not Attempted" : d.user) +
            "<br>";


        if(d.correct !== undefined){

            html +=
                "Correct Answer: " +
                d.correct +
                "<br>";

        }else{

            html +=
                "<span class='status'>Answer key available nahi hai.</span><br>";

        }


        if(d.state === "Correct"){

            html +=
                "<span class='correct'>Correct +" +
                d.marks.toFixed(2) +
                "</span>";

        }else if(d.state === "Wrong"){

            html +=
                "<span class='wrong'>Wrong " +
                d.marks.toFixed(2) +
                "</span>";

        }else{

            html +=
                d.state;

        }


        if(d.q.solution){

            html +=
                "<div class='solution'><b>Solution:</b><br>" +
                escapeHTML(d.q.solution) +
                "</div>";

        }


        div.innerHTML=html;

        box.appendChild(div);

    });


    $("answerKeyAfter").innerHTML =
        Object.keys(answerKey).length
        ? "<div class='status'>Answer key successfully used for scoring.</div>"
        : "<div class='status'>Answer key upload nahi ki gayi, isliye score verification nahi hua.</div>";

}


/* ESCAPE */

function escapeHTML(str){

    return String(str || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}
